{% extends "base.html" %}
{% block title %}404 — Link Not Found | Shortly{% endblock %}
{% block body %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="error-title">Link not found</h1>
    <p class="error-desc">This short link doesn't exist or may have expired. Double-check the URL or create a new one.</p>
    <a href="{{ url_for('views.index') }}" class="primary-btn">
      <span class="material-symbols-outlined" aria-hidden="true">add_link</span>
      Create a new link
    </a>
  </div>
</div>
{% endblock %}
